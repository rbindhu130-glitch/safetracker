<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>safetracker | Signup</title>
  <link rel="stylesheet" href="../style/signup.css">
</head>

<body>
  <!-- Signup Box -->
  <div class="Signup">
    <h2>Sign Up</h2>

    <form>
      <label for="username">Username</label>
      <input type="text" id="username" required />

      <label for="mobile">Mobile</label>
      <input type="tel" id="mobile" required />

      <label for="email">Email</label>
      <input type="email" id="email" required />

      <label for="role">Role</label>
      <select id="role" required>
        <option value="">Select role</option>
        <option value="user">User</option>
        <option value="volunteer">Volunteer</option>
      </select>

      <!-- Volunteer image upload -->
      <div id="imageSection" style="display: none">
        <label for="image">Upload Image</label>
        <input type="file" id="image" />
      </div>

      <label for="password">Password</label>
      <input type="password" id="password" required />

      <button type="button" class="signup-btn" onclick="window.location.href='./user.html'">Signup</button>

      <p class="login">
        Already have an account?
        <a href="./login.html">Login</a>
      </p>
    </form>
  </div>

  <a href="../index.html" class="home-outside">← Back to Home</a>

  <script>
    const role = document.getElementById("role");
    const imageSection = document.getElementById("imageSection");
    const imageInput = document.getElementById("image");

    role.addEventListener("change", () => {
      if (role.value === "volunteer") {
        imageSection.style.display = "block";
        imageInput.required = true;
      } else {
        imageSection.style.display = "none";
        imageInput.required = false;
      }
    });
  </script>
</body>

</html>
